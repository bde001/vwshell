name: Android CI Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VWShell-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (rolling tag ci-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-apk
          name: "VWShell Debug APK (latest CI build)"
          body: "Автоматически собранный debug APK из GitHub Actions. targetSdk=33 (Android 13)."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_draft: false
          prerelease: true
          fail_on_unmatched_files: true
